name: Extract ZIP into repository

on:
  push:
    branches: [main]
    paths:
      - "NYAMIST_RECOVERED_CETO.zip"
      - ".github/workflows/gidot-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract archive safely
        run: |
          python3 - <<'PY'
          import os, zipfile
          from pathlib import PurePosixPath

          archive = "NYAMIST_RECOVERED_CETO.zip"
          target = os.path.abspath("recovered")
          os.makedirs(target, exist_ok=True)

          total = 0
          count = 0
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  mode = (info.external_attr >> 16) & 0o170000
                  if path.is_absolute() or ".." in path.parts or mode == 0o120000:
                      raise SystemExit(f"Unsafe ZIP entry: {name}")
                  if info.is_dir():
                      continue
                  if info.file_size > 100 * 1024 * 1024:
                      raise SystemExit(f"File exceeds GitHub 100 MB limit: {name}")
                  total += info.file_size
                  if total > 500 * 1024 * 1024:
                      raise SystemExit("Archive expands beyond 500 MB safety limit")
                  dest = os.path.abspath(os.path.join(target, *path.parts))
                  if os.path.commonpath([target, dest]) != target:
                      raise SystemExit(f"Path escapes extraction directory: {name}")
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  with z.open(info) as src, open(dest, "wb") as dst:
                      while True:
                          chunk = src.read(1024 * 1024)
                          if not chunk:
                              break
                          dst.write(chunk)
                  count += 1

          print(f"Extracted {count} files ({total} uncompressed bytes) into recovered/")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered/
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract recovered ZIP contents"
            git push
          fi
