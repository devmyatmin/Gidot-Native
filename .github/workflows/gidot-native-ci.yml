name: Stranded Deep - Godot GLB validation

on:
  push:
    branches: [main]
    paths:
      - "Github/reconstructed_v5/Stranded_Deep_No_Impostors.glb"
      - ".github/workflows/gidot-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-glb-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (including Git LFS assets)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --headless --version

      - name: Prepare isolated Godot project
        run: |
          GLB="Github/reconstructed_v5/Stranded_Deep_No_Impostors.glb"
          test -s "$GLB"
          mkdir -p .ci-godot-project
          cp "$GLB" .ci-godot-project/Stranded_Deep_No_Impostors.glb
          cat > .ci-godot-project/project.godot <<'EOF'
          config_version=5

          [application]
          config/name="Stranded Deep GLB CI Test"
          EOF
          cat > .ci-godot-project/ci_validate_glb.gd <<'EOF'
          extends SceneTree

          func inspect_node(node: Node, stats: Dictionary) -> void:
              if node is MeshInstance3D:
                  var mesh_instance := node as MeshInstance3D
                  stats["mesh_instances"] += 1
                  if mesh_instance.mesh == null:
                      stats["meshless_instances"] += 1
                  else:
                      var mesh := mesh_instance.mesh
                      for surface_index in range(mesh.get_surface_count()):
                          stats["surfaces"] += 1
                          var arrays := mesh.surface_get_arrays(surface_index)
                          var vertices = arrays[Mesh.ARRAY_VERTEX]
                          if vertices is PackedVector3Array:
                              stats["vertices"] += vertices.size()
              for child in node.get_children():
                  inspect_node(child, stats)

          func _initialize() -> void:
              var path := "res://Stranded_Deep_No_Impostors.glb"
              var packed := ResourceLoader.load(path) as PackedScene
              if packed == null:
                  push_error("GLB_LOAD_FAIL: Godot did not import the GLB as PackedScene")
                  quit(1)
                  return

              var instance := packed.instantiate()
              if instance == null:
                  push_error("GLB_INSTANTIATE_FAIL: PackedScene instantiation failed")
                  quit(1)
                  return

              var stats := {
                  "mesh_instances": 0,
                  "meshless_instances": 0,
                  "surfaces": 0,
                  "vertices": 0
              }
              inspect_node(instance, stats)

              print("GLB_LOAD_PASS: ", path)
              print("ROOT_TYPE: ", instance.get_class())
              print("ROOT_CHILDREN: ", instance.get_child_count())
              print("MESH_INSTANCES: ", stats["mesh_instances"])
              print("MESHLESS_INSTANCES: ", stats["meshless_instances"])
              print("SURFACES: ", stats["surfaces"])
              print("VERTICES: ", stats["vertices"])

              if stats["mesh_instances"] == 0 or stats["surfaces"] == 0 or stats["vertices"] == 0:
                  push_error("GLB_GEOMETRY_FAIL: Imported scene contains no usable mesh geometry")
                  instance.free()
                  quit(1)
                  return

              print("GLB_GEOMETRY_PASS")
              instance.free()
              quit(0)
          EOF

      - name: Import GLB and validate scene in Godot
        run: |
          "$GODOT_BIN" --headless --editor --path .ci-godot-project --import --quit
          "$GODOT_BIN" --headless --path .ci-godot-project --script res://ci_validate_glb.gd

      - name: Upload Godot validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stranded-deep-godot-glb-validation
          path: |
            .ci-godot-project/.godot/imported/
          if-no-files-found: warn
