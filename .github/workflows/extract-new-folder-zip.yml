name: Inspect New Folder ZIP

on:
  push:
    paths:
      - ".github/workflows/extract-new-folder-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json
          zips = list(Path(".").rglob("New Folder.zip"))
          if len(zips) != 1:
              raise SystemExit(f"Expected one New Folder.zip, found {len(zips)}")
          archive = zips[0]
          out = Path("/tmp/inspect")
          out.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive) as z:
              bad = z.testzip()
              if bad: raise SystemExit(f"ZIP integrity FAIL: {bad}")
              for i in z.infolist():
                  target = (out / i.filename).resolve()
                  if not target.is_relative_to(out.resolve()):
                      raise SystemExit(f"Unsafe ZIP path: {i.filename}")
              z.extractall(out)
          files = sorted(p for p in out.rglob("*") if p.is_file())
          rows = []
          for p in files:
              b = p.read_bytes()
              rows.append({"path":str(p.relative_to(out)),"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})
          report = {"archive":str(archive),"archive_bytes":archive.stat().st_size,"archive_sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),"zip_integrity":"PASS","file_count":len(rows),"files":rows}
          Path("/tmp/ZIP_INVENTORY.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          Path("/tmp/ZIP_FILE_LIST.txt").write_text("\\n".join(f'{x["bytes"]:>10} {x["path"]}' for x in rows),encoding="utf-8")
          print(json.dumps({k:v for k,v in report.items() if k!="files"},indent=2))
          print(Path("/tmp/ZIP_FILE_LIST.txt").read_text())
          PY

      - name: Decompile C# assemblies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/decompiled
          mapfile -d '' DLLS < <(find /tmp/inspect -type f -iname '*.dll' -print0)
          echo "DLL_COUNT=${#DLLS[@]}"
          if [ "${#DLLS[@]}" -gt 0 ]; then
            dotnet tool install ilspycmd --tool-path /tmp/ilspy
            for dll in "${DLLS[@]}"; do
              rel="${dll#/tmp/inspect/}"
              safe=$(echo "$rel" | tr '/ ' '__')
              mkdir -p "/tmp/decompiled/$safe"
              /tmp/ilspy/ilspycmd -p -o "/tmp/decompiled/$safe" "$dll" || echo "DECOMPILE_FAILED $rel"
            done
          fi
          cp /tmp/ZIP_INVENTORY.json /tmp/inspect/
          cp /tmp/ZIP_FILE_LIST.txt /tmp/inspect/

      - name: Upload private review artifact (not committed to repository)
        uses: actions/upload-artifact@v4
        with:
          name: new-folder-zip-review
          path: |
            /tmp/inspect/
            /tmp/decompiled/
          if-no-files-found: error
          retention-days: 14
