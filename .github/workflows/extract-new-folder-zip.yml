name: Extract and inspect New Folder ZIP

on:
  push:
    paths:
      - ".github/workflows/extract-new-folder-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract ZIP and create complete inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json
          zips = list(Path(".").rglob("New Folder.zip"))
          if len(zips) != 1:
              raise SystemExit(f"Expected one New Folder.zip, found {len(zips)}: {zips}")
          archive = zips[0]
          out = Path("/tmp/new-folder-extracted")
          out.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive) as z:
              bad = z.testzip()
              if bad: raise SystemExit(f"Corrupt ZIP member: {bad}")
              for i in z.infolist():
                  dest = (out / i.filename).resolve()
                  if not dest.is_relative_to(out.resolve()):
                      raise SystemExit(f"Unsafe path: {i.filename}")
              z.extractall(out)
          files = sorted(p for p in out.rglob("*") if p.is_file())
          rows = []
          for p in files:
              b = p.read_bytes()
              rows.append({"path":str(p.relative_to(out)),"size":len(b),"sha256":hashlib.sha256(b).hexdigest()})
          report = {
              "archive":str(archive),
              "archive_bytes":archive.stat().st_size,
              "archive_sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
              "zip_integrity":"PASS",
              "file_count":len(rows),
              "files":rows
          }
          Path("/tmp/new-folder-inventory.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          Path("/tmp/new-folder-file-list.txt").write_text("\\n".join(f'{x["size"]:>10}  {x["path"]}' for x in rows),encoding="utf-8")
          print(json.dumps({k:v for k,v in report.items() if k!="files"},indent=2))
          print(Path("/tmp/new-folder-file-list.txt").read_text())
          PY

      - name: Decompile managed assemblies when present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/new-folder-decompiled
          mapfile -d '' DLLS < <(find /tmp/new-folder-extracted -type f -iname '*.dll' -print0)
          echo "DLL_COUNT=${#DLLS[@]}"
          if [ "${#DLLS[@]}" -gt 0 ]; then
            dotnet tool install ilspycmd --tool-path /tmp/ilspy-tools
            for dll in "${DLLS[@]}"; do
              name=$(basename "$dll" .dll)
              mkdir -p "/tmp/new-folder-decompiled/$name"
              /tmp/ilspy-tools/ilspycmd -p -o "/tmp/new-folder-decompiled/$name" "$dll" || echo "DECOMPILE_FAILED: $dll"
            done
          fi
          cp /tmp/new-folder-inventory.json /tmp/new-folder-extracted/
          cp /tmp/new-folder-file-list.txt /tmp/new-folder-extracted/

      - name: Package inspection results for ChatGPT review
        uses: actions/upload-artifact@v4
        with:
          name: new-folder-zip-inspection
          path: |
            /tmp/new-folder-extracted/
            /tmp/new-folder-decompiled/
          if-no-files-found: error
          retention-days: 14
